# Builds the Fedora/openSUSE RPM packages on GitHub's Linux machines - rpmbuild isn't on the release Mac.
# Run by hand (Actions -> RPM -> Run workflow, or `gh workflow run rpm.yml`); the packages are workflow artifacts.
name: RPM
on: workflow_dispatch
jobs:
  rpm:
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-24.04, arch: x64 }
          - { runs-on: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 24 }
      - run: sudo apt-get install -y rpm
      - run: npm ci
      - run: npx electron-builder --linux rpm --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decomp-buddy-${{ matrix.arch }}.rpm
          path: dist/*.rpm
